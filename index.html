<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Obsidian Star Band</title>
  <style>
    .js-loading #page-content { visibility: hidden; }
    body {
      font-family: Rockwell, serif;
      background-image: url('assets/photos/obsidianstar.jpg');
      background-repeat: repeat;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #cc0000;
      text-align: center;
      text-shadow: 0 0 10px #ff0000;
      margin-top: 0;
      margin-bottom: 5px;
    }
    a {
      color: #ffcc00;
      text-decoration: underline;
      text-shadow: 0 0 5px #ffcc00;
    }
    a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
    }
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(11,6,41,0.92) 0%, rgba(18,11,38,0.96) 50%, rgba(11,6,41,0.92) 100%);
      padding: 10px 15px 15px 15px; /* reduced top padding */
      color: #ffffff;
      border-radius: 12px;
      border: 1px solid #3a2b5c;
      box-shadow: 0 0 25px rgba(105,7,7,0.6), inset 0 0 25px rgba(105,7,7,0.2);
      box-sizing: border-box;
    }
    .marquee {
      color: #ff0000;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0000;
      margin: 0;
      display: block;
    }
    .main-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-top: 0; /* removed extra top gap */
    }
    .sidebar {
      width: 180px;
      background: rgba(42,27,61,0.6);
      border: 1px solid rgba(105,7,7,0.4);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(105,7,7,0.3);
      flex-shrink: 0;
    }
    .sidebar a {
      display: block;
      background: rgba(11,6,41,0.8);
      color: #ffcc00;
      text-decoration: none;
      text-shadow: 0 0 5px #ffcc00;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(105,7,7,0.5);
      border-radius: 5px;
      text-align: center;
      transition: all 0.3s;
    }
    .sidebar a:hover {
      background: rgba(105,7,7,0.4);
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
      border-color: #ff0000;
    }
    .content {
      flex: 1;
    }
    .footer {
      text-align: center;
      font-size: small;
      padding: 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(11,6,41,0.9));
      color: #ffffff;
      border-top: 1px solid #690707;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 -2px 10px rgba(105,7,7,0.4);
    }
    table {
      width: 100%;
      background: transparent;
      border-collapse: separate;
      border-spacing: 0;
      border: none;
      color: #ffffff;
    }
    td {
      background: rgba(18,11,38,0.6);
      border: 1px solid rgba(105,7,7,0.3);
      border-radius: 8px;
      padding: 15px;
      color: #ffffff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }
    .bio {
      margin-bottom: 15px;
    }
    .pics {
      position: relative;
      max-width: 600px;
      margin: 10px auto 0;
      overflow: hidden;
      border: 2px solid rgba(105,7,7,0.6);
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(105,7,7,0.5);
      background: rgba(0,0,0,0.35);
    }
    .carousel-track {
      display: flex;
      transition: transform 0.35s ease;
    }
    .carousel-slide {
      min-width: 100%;
      aspect-ratio: 3 / 2;
      display: grid;
      place-items: center;
    }
    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      width: 36px;
      height: 36px;
      border: 1px solid #ffcc00;
      border-radius: 50%;
      background: rgba(11,6,41,0.85);
      color: #ffcc00;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0 0 2px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .carousel-button:hover {
      background: rgba(105,7,7,0.85);
      color: #ffffff;
    }
    .carousel-button.previous {
      left: 10px;
    }
    .carousel-button.next {
      right: 10px;
    }
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .carousel-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 1px solid #ffcc00;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .carousel-dot.active {
      background: #ffcc00;
    }
    .pics img {
      margin-top: 10px;
    }
    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }
    .social-links a {
      background: rgba(11,6,41,0.8);
      color: #ffcc00;
      text-decoration: none;
      text-shadow: 0 0 5px #ffcc00;
      padding: 8px 15px;
      border: 1px solid rgba(105,7,7,0.5);
      border-radius: 5px;
      transition: all 0.3s;
    }
    .social-links a:hover {
      background: rgba(105,7,7,0.4);
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
      border-color: #ff0000;
    }
    @media (max-width: 600px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
      }
      .sidebar a {
        display: inline-block;
        margin-right: 5px;
        margin-bottom: 0;
      }
      .pics {
        justify-content: center;
      }
      .pics img {
        margin: 5px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <marquee class="marquee">Obsidian Star Band!!!!!!!</marquee>

  <h1>Obsidian Star</h1>

  <div class="main-layout">
    <div class="sidebar">
      <a href="index.html">Home</a>
      <a href="about.html">About the Band</a>
      <a href="contact.html">Contact</a>
      <a href="shows.html">Shows</a>
      <a href="songs.html">Songs</a>
    </div>
    <div class="content">
      <table cellpadding="10" cellspacing="0" border="0">
        <tr>
          <td>
            <h2>About</h2>
            <p class="bio">
              Obsidian Star is an Alternative Rock Band based in the Rochester NY area. Click "About the Band" for more info!
            </p>

            <h2>Pictures</h2>
            <div class="pics" id="photo-carousel" aria-label="Band photos">
              <div class="carousel-track"></div>
              <button class="carousel-button previous" type="button" aria-label="Previous photo">&#10094;</button>
              <button class="carousel-button next" type="button" aria-label="Next photo">&#10095;</button>
              <div class="carousel-dots"></div>
            </div>
          </td>
        </tr>
      </table>

      <!-- Social links (replaces image buttons) -->
      <div class="social-links">
        <a href="https://www.youtube.com/@obsidianstarband" target="_blank">YouTube</a>
        <a href="https://www.instagram.com/obsidianstarband" target="_blank">Instagram</a>
        <a href="mailto:obsidianstar.band@gmail.com">Email</a>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <p>Copyright &copy; Obsidian Star Band. All rights reserved.</p>
  </div>
</div>

  <script src="assets/js/load-data.js"></script>
  <script src="assets/js/carousel.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.loadPageData) loadPageData('index', { targetId: 'page-content' }).catch(() => {});
  });
</script>


</body>
</html>
