<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Shows - Obsidian Star Band</title>
  <style>
    .js-loading #upcoming-shows, .js-loading #previous-shows { visibility: hidden; }
    body {
      font-family: Rockwell, serif;
      background-image: url('assets/photos/obsidianstar.jpg');
      background-repeat: repeat;
      color: #ffffff;
      margin: 0;
    }
    h1 {
      color: #cc0000;
      text-align: center;
      text-shadow: 0 0 10px #ff0000;
    }
    a {
      color: #ffcc00;
      text-decoration: underline;
      text-shadow: 0 0 5px #ffcc00;
    }
    a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
    }
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(11,6,41,0.92) 0%, rgba(18,11,38,0.96) 50%, rgba(11,6,41,0.92) 100%);
      padding: 15px;
      color: #ffffff;
      border-radius: 12px;
      border: 1px solid #3a2b5c;
      box-shadow: 0 0 25px rgba(105,7,7,0.6), inset 0 0 25px rgba(105,7,7,0.2);
      box-sizing: border-box;
    }
    .marquee {
      color: #ff0000;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0000;
      margin: 0;
    }
    .main-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-top: 15px;
    }
    .sidebar {
      width: 180px;
      background: rgba(42,27,61,0.6);
      border: 1px solid rgba(105,7,7,0.4);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(105,7,7,0.3);
      flex-shrink: 0;
    }
    .sidebar a {
      display: block;
      background: rgba(11,6,41,0.8);
      color: #ffcc00;
      text-decoration: none;
      text-shadow: 0 0 5px #ffcc00;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(105,7,7,0.5);
      border-radius: 5px;
      text-align: center;
      transition: all 0.3s;
    }
    .sidebar a:hover {
      background: rgba(105,7,7,0.4);
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
      border-color: #ff0000;
    }
    .content {
      flex: 1;
    }
    .footer {
      text-align: center;
      font-size: small;
      padding: 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(11,6,41,0.9));
      color: #ffffff;
      border-top: 1px solid #690707;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 -2px 10px rgba(105,7,7,0.4);
    }
    table {
      width: 100%;
      background: transparent;
      border-collapse: separate;
      border-spacing: 0;
      border: none;
      color: #ffffff;
    }
    td, th {
      background: rgba(18,11,38,0.6);
      border: 1px solid rgba(105,7,7,0.3);
      border-radius: 5px;
      padding: 10px;
      color: #ffffff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }
    th {
      background: rgba(42,27,61,0.8);
      text-shadow: 0 0 5px #ffcc00;
    }
    .show-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .show-item {
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(11,6,41,0.6);
      border-radius: 8px;
      border: 1px solid rgba(105,7,7,0.2);
    }
    .show-item:last-child {
      margin-bottom: 0;
    }
    .show-link {
      float: right;
      background: rgba(255,204,0,0.06);
      color: #ffcc00;
      padding: 6px 8px;
      border-radius: 4px;
      text-decoration: none;
      border: 1px solid rgba(105,7,7,0.3);
    }
    .show-link:hover {
      color: #fff;
      border-color: #ff0000;
    }
    @media (max-width: 600px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        margin-bottom: 15px;
        padding: 10px;
      }
      .sidebar a {
        display: inline-block;
        margin-right: 5px;
        margin-bottom: 0;
      }
      .show-link {
        float: none;
        display: block;
        margin-top: 5px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <marquee class="marquee">Obsidian Star</marquee>

  <h1>Upcoming Shows</h1>

  <div class="main-layout">
    <div class="sidebar">
      <a href="index.html">Home</a>
      <a href="about.html">About the Band</a>
      <a href="contact.html">Contact</a>
      <a href="shows.html">Shows</a>
      <a href="songs.html">Songs</a>
    </div>
    <div class="content">
      <table cellpadding="10" cellspacing="0" border="0">
        <tr>
          <td>
            <h2>Upcoming Shows</h2>
            <div id="upcoming-shows"></div>

            <h2>Previous Shows</h2>
            <div id="previous-shows"></div>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <div class="footer">
    <p>Copyright &copy; Obsidian Star Band. All rights reserved.</p>
  </div>
</div>

<script src="assets/js/load-data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.loadPageData) {
      loadPageData('shows', { targetId: 'upcoming-shows', skipTitle: true, listId: 'upcoming' }).catch(() => {});
      loadPageData('shows', { targetId: 'previous-shows', skipTitle: true, listId: 'previous' }).catch(() => {});
    }
  });
</script>

</body>
</html>
