name: Build content

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Run renderer
        run: |
          node scripts/render.js

      - name: Upload site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site-dist
          path: dist
