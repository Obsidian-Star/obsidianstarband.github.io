<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songs & Videos - Obsidian Star Band</title>
  <style>
    body {
      font-family: Rockwell, serif;
      background-image: url('obsidianstar.jpg');
      background-repeat: repeat;
      color: #ffffff;
    }
    h1 {
      color: #cc0000;
      text-align: center;
      text-shadow: 0 0 10px #ff0000;
    }
    a {
      color: #ffcc00;
      text-decoration: underline;
      text-shadow: 0 0 5px #ffcc00;
    }
    a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
    }
    .container {
      width: 800px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(11,6,41,0.92) 0%, rgba(18,11,38,0.96) 50%, rgba(11,6,41,0.92) 100%);
      padding: 20px;
      color: #ffffff;
      border-radius: 12px;
      border: 1px solid #3a2b5c;
      box-shadow: 0 0 25px rgba(105,7,7,0.6), inset 0 0 25px rgba(105,7,7,0.2);
    }
    .nav {
      background: rgba(42,27,61,0.8);
      padding: 8px;
      margin-bottom: 15px;
      text-align: center;
      border: none;
      border-bottom: 2px solid #690707;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 2px 15px rgba(105,7,7,0.5);
    }
    .nav a {
      color: #ffcc00;
    }
    .footer {
      text-align: center;
      font-size: small;
      padding: 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(11,6,41,0.9));
      color: #ffffff;
      border-top: 1px solid #690707;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 -2px 10px rgba(105,7,7,0.4);
    }
    .marquee {
      color: #ff0000;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0000;
    }
    table {
      width: 100%;
      background: transparent;
      border-collapse: separate;
      border-spacing: 0;
      border: none;
      color: #ffffff;
    }
    td {
      background: rgba(18,11,38,0.6);
      border: 1px solid rgba(105,7,7,0.3);
      border-radius: 8px;
      padding: 15px;
      color: #ffffff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }
    audio, video {
      background: rgba(18,11,38,0.8);
      border: 1px solid rgba(105,7,7,0.5);
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(105,7,7,0.4);
    }
  </style>
</head>
<body>

<div class="container">
